<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<style>html, body { margin: 0; background: #0B0B0D; }</style>
</head>
<body>
<script>
/*
 * Free My TV på kompisens projektor (Android): laddaren, som lg/index.html. Vid varje start hämtar den den senaste
 * koden från GitHub-repot MrOrtiiz/my-tv (mappen tv/, samma som The Frame och LG) via jsDelivr, låst till senaste
 * commit, och skriver in den i den här sidan, som har kvar appens eget ursprung (lagringen och bryggan FMTVAndroid).
 * Efter tv/config.js läses android/kompis.js (projektorns egna val, bl.a. Valencia i Barça-rutan). Spelen tas bort
 * (SKIP): de är bara för Yuris TV:ar. Utan internet: den inbyggda kopian i app/. ES5.
 */
(function () {
  'use strict';
  var REPO = 'MrOrtiiz/my-tv', VERSION = '1.3.0';
  // Vilken TV: 'kompis' (kompisens projektor) eller 'kontor' (Yuris TV på jobbet); android/build.sh sätter den.
  var PROFILE = 'kompis';
  var KEY = 'fmtv.live';   // senaste commit som gick att ladda
  var SKIP = ['dance.js', 'rush.js', 'dance.css', 'rush.css'];

  function stored() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function store(sha) { try { localStorage.setItem(KEY, sha); } catch (e) {} }

  function get(url, timeout, headers, done) {
    var x = new XMLHttpRequest(), over = false;
    function end(text) { if (over) return; over = true; done(text); }
    try {
      x.open('GET', url, true);
      x.timeout = timeout;
      for (var h in headers) x.setRequestHeader(h, headers[h]);
      x.onreadystatechange = function () {
        if (x.readyState === 4) end(x.status === 200 ? x.responseText : null);
      };
      x.ontimeout = x.onerror = function () { end(null); };
      x.send();
    } catch (e) { end(null); }
  }

  function local() { location.replace('app/index.html'); }

  /** tv/index.html med projektorns tillägg; samma ändringar gör android/build.sh i den inbyggda kopian. */
  function adapt(html, before, commit) {
    var info = '<script>window.FMTV_LOADER = {platform: "android", version: "' + VERSION + '", commit: "' + commit + '"};<\/script>';
    for (var i = 0; i < SKIP.length; i++) {
      html = html.replace('<script src="' + SKIP[i] + '"><\/script>', '').replace('<link rel="stylesheet" href="' + SKIP[i] + '">', '');
    }
    return html.replace(/<head>/i, '<head>' + before + info)
      .replace('<script src="config.js"><\/script>', '<script src="config.js"><\/script><script src="../android/' + PROFILE + '.js"><\/script>');
  }

  /** Skriver in tv/index.html från commit `sha`; otherwise() om den inte gick att hämta. */
  function open(sha, otherwise) {
    var base = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + sha + '/';
    get(base + 'tv/index.html', 10000, {}, function (html) {
      if (!html || html.indexOf('home.js') < 0) { otherwise(); return; }
      store(sha);
      document.open();
      document.write(adapt(html, '<base href="' + base + 'tv/">', sha.slice(0, 7)));
      document.close();
    });
  }

  var last = stored();
  get('https://api.github.com/repos/' + REPO + '/commits/main', 5000, {Accept: 'application/vnd.github.sha'}, function (sha) {
    sha = sha && /^[0-9a-f]{40}$/.test(sha.trim()) ? sha.trim() : '';
    if (sha) open(sha, function () { if (last && last !== sha) open(last, local); else local(); });
    else if (last) open(last, local);
    else local();
  });
})();
</script>
</body>
</html>
