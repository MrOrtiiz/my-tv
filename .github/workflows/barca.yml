# FC Barcelona on your IPTV, for the home screen's Barça box: every 3 hours, and by hand (Actions → Barça → Run workflow).
name: Barça
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: barca
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read the guide
        env:
          EPG_URL: ${{ secrets.EPG_URL }}
        run: python3 .github/scripts/barca.py
      - name: Save
        run: |
          git config user.name "my-tv bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/barca.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          # Only the time of the update changed (and it had been made before): not worth a commit.
          if [ "$(git diff --cached --numstat | awk '{s+=$1} END {print s}')" = "1" ] && ! git show HEAD:data/barca.json | grep -q '"updated": 0'; then echo "Only the time changed."; exit 0; fi
          git commit -m "Barça: the coming matches on your channels"
          git push
