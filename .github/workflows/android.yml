# Bygger Free My TV för kompisens projektor (android/) och lägger APK:n i releasen "projektor":
# https://github.com/MrOrtiiz/my-tv/releases/download/projektor/FreeMyTV-projektor.apk
# Hemskärmens kod (tv/) behöver ingen ny APK: appen hämtar den vid varje start. Bara ändringar i android/ bygger om.
# Signeringsnyckeln ligger i ett utkast till release ("android-signing"), som bara den med skrivrätt ser, så att varje
# ny APK kan installeras över den förra.
name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KS_PASS: freemytv
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Signeringsnyckeln
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft and .tag_name == "android-signing") | .id' | head -1)"
          if [ -n "$id" ]; then
            asset="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | select(.name == "fmtv.keystore") | .id')"
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "$RUNNER_TEMP/fmtv.keystore"
            echo "Nyckeln hämtad."
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/fmtv.keystore" -storepass "$KS_PASS" -keypass "$KS_PASS" -alias fmtv \
              -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Free My TV Projektor"
            gh release create android-signing "$RUNNER_TEMP/fmtv.keystore" --draft --title "Android-signering (privat, publicera inte)" \
              --notes "Nyckeln som signerar FreeMyTV-projektor.apk. Ett utkast: bara den med skrivrätt ser den. Ta inte bort den, då kan nästa APK inte installeras över den förra."
            echo "Ny nyckel skapad och sparad i utkastet android-signing."
          fi
          keytool -list -keystore "$RUNNER_TEMP/fmtv.keystore" -storepass "$KS_PASS" | tail -2
          echo "KEYSTORE=$RUNNER_TEMP/fmtv.keystore" >> "$GITHUB_ENV"

      - name: Bygg APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash android/build.sh

      - name: Lägg i releasen "projektor"
        run: |
          notes="Free My TV för kompisens projektor (HY300 Pro+). Commit ${GITHUB_SHA::7}. Installera FreeMyTV-projektor.apk på projektorn; se claude/kompis-projektor.md i TV-projektet."
          if gh release view projektor >/dev/null 2>&1; then
            gh release upload projektor FreeMyTV-projektor.apk --clobber
            gh release edit projektor --notes "$notes"
          else
            gh release create projektor FreeMyTV-projektor.apk --title "Free My TV – projektorn" --notes "$notes" --latest=false
          fi
